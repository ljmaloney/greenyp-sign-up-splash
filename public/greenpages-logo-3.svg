<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" fill="none">
  <defs>
    <linearGradient id="leaf3" x1="170" y1="16" x2="170" y2="132" gradientUnits="userSpaceOnUse">
      <stop stop-color="#86efac"/>
      <stop offset="0.5" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- Leaf: pointed apex at top, wide rounded base, small stem below -->
  <g transform="translate(140, 12) rotate(-8 30 70)">
    <!-- Stem -->
    <rect x="28" y="118" width="4" height="14" rx="2" fill="#15803d"/>
    <!-- Leaf body (inverted teardrop) -->
    <path d="M30 4 C 2 26, -2 88, 30 120 C 62 88, 58 26, 30 4 Z" fill="url(#leaf3)"/>
    <!-- Central vein -->
    <path d="M30 10 L 30 128" stroke="#14532d" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.55"/>
    <!-- Side veins -->
    <path d="M30 30 Q 22 36 14 42" stroke="#14532d" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M30 56 Q 18 64 6 72" stroke="#14532d" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M30 82 Q 18 90 8 98" stroke="#14532d" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M30 104 Q 22 110 16 114" stroke="#14532d" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M30 30 Q 38 36 46 42" stroke="#14532d" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M30 56 Q 42 64 54 72" stroke="#14532d" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M30 82 Q 42 90 52 98" stroke="#14532d" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M30 104 Q 38 110 44 114" stroke="#14532d" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.4"/>
  </g>

  <!-- Wordmark: GreenPages -->
  <text x="170" y="190" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#15803d">Green</tspan><tspan fill="#22c55e">Pages</tspan>
  </text>

  <!-- Tagline -->
  <text x="170" y="218" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5" fill="#22c55e">
    Your Garden. Their Expertise.
  </text>
</svg>
