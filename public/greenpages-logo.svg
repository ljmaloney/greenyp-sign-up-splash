<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" fill="none">
  <!-- Circular Leaf Emblem -->
  <g transform="translate(5, 5)">
    <!-- Circular background -->
    <circle cx="25" cy="25" r="24" fill="#134e2a"/>
    <circle cx="25" cy="25" r="22" fill="#1a5c34" stroke="#0d3d20" stroke-width="1"/>
    
    <!-- Leaf shape - rotated 90 degrees pointing right -->
    <g transform="rotate(90, 25, 25)">
      <path d="M25 10C25 10 14 18 14 29C14 37 19 42 25 42C31 42 36 37 36 29C36 18 25 10 25 10Z" fill="#2d8a4e"/>
      <!-- Leaf highlight -->
      <path d="M25 12C25 12 17 19 17 28C17 34 20 38 25 38" fill="#3da864" opacity="0.6"/>
      <!-- Center vein -->
      <path d="M25 15V38" stroke="#134e2a" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Side veins -->
      <path d="M25 20L20 24M25 26L18 30M25 32L21 35" stroke="#134e2a" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
      <path d="M25 20L30 24M25 26L32 30M25 32L29 35" stroke="#134e2a" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
    </g>
  </g>
  
  <!-- Text: GreenYP -->
  <text x="65" y="40" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">
    <tspan fill="#134e2a">Green</tspan><tspan fill="#2d8a4e">YP</tspan>
  </text>
</svg>
