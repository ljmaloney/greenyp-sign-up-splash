<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none">
  <defs>
    <linearGradient id="leaf2" x1="40" y1="0" x2="40" y2="76" gradientUnits="userSpaceOnUse">
      <stop stop-color="#86efac"/>
      <stop offset="0.5" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- Leaf: pointed apex at top, wide rounded base, small stem below -->
  <g transform="translate(10, 0) rotate(-10 30 38)">
    <!-- Stem -->
    <rect x="28.5" y="64" width="3" height="10" rx="1.5" fill="#15803d"/>
    <!-- Leaf body (inverted teardrop) -->
    <path d="M30 4 C 8 22, 4 52, 30 66 C 56 52, 52 22, 30 4 Z" fill="url(#leaf2)"/>
    <!-- Central vein -->
    <path d="M30 8 L 30 72" stroke="#14532d" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.55"/>
    <!-- Side veins (fan outward, longer toward wider base) -->
    <path d="M30 22 Q 24 26 19 30" stroke="#14532d" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M30 36 Q 21 42 13 48" stroke="#14532d" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M30 50 Q 22 56 16 60" stroke="#14532d" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M30 22 Q 36 26 41 30" stroke="#14532d" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M30 36 Q 39 42 47 48" stroke="#14532d" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M30 50 Q 38 56 44 60" stroke="#14532d" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.4"/>
  </g>

  <!-- Wordmark: GreenYP -->
  <text x="90" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#15803d">Green</tspan><tspan fill="#22c55e">YP</tspan>
  </text>
</svg>
