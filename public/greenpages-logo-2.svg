<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none">
  <defs>
    <linearGradient id="leaf2" x1="40" y1="8" x2="40" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#86efac"/>
      <stop offset="0.5" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- Leaf (upright tear-drop, slight tilt) -->
  <g transform="translate(10, 4) rotate(-12 40 40)">
    <path d="M40 4 C 12 22, 8 58, 40 76 C 72 58, 68 22, 40 4 Z" fill="url(#leaf2)"/>
    <!-- Central vein -->
    <path d="M40 10 Q 36 42 42 74" stroke="#14532d" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.55"/>
    <!-- Side veins -->
    <path d="M40 24 Q 30 28 22 34" stroke="#14532d" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M40 38 Q 28 44 18 52" stroke="#14532d" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M40 52 Q 30 58 24 64" stroke="#14532d" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M40 24 Q 50 28 58 34" stroke="#14532d" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M40 38 Q 52 44 62 50" stroke="#14532d" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M40 52 Q 50 58 56 62" stroke="#14532d" stroke-width="1.1" stroke-linecap="round" fill="none" opacity="0.4"/>
  </g>

  <!-- Wordmark: GreenYP -->
  <text x="100" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#15803d">Green</tspan><tspan fill="#22c55e">YP</tspan>
  </text>
</svg>
